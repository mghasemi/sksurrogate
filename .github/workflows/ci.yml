name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Notes on design (see Vikunja project "SKSurrogate", task A1):
# - The legacy .travis.yml never ran the test suite; it only installed
#   requirements and executed examples/example02.py. Both behaviours are
#   preserved, plus a real pytest run and packaging checks.
# - `build` covers the Python version matrix with an isolated PEP 517 build
#   (no dependencies installed), so it stays green even while individual
#   third-party wheels lag behind on newest interpreters.
# - `tests` runs on one modern interpreter with current unpinned
#   requirements (requirements.txt carries no pins; pinning/sklearn-matrix
#   is follow-up work). A3 fixes any deprecations this surfaces.

jobs:
  build:
    name: "Build sdist+wheel (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build backend
        run: pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-py${{ matrix.python-version }}
          path: dist/

  # Acceptance for task A2: `pip install sksurrogate` from the built
  # wheel must succeed on Python 3.13 with current dependencies, and the
  # package must import in a clean environment (i.e. install_requires is
  # complete). Runs after `build` so it installs what CI itself produced.
  install-smoke:
    name: "Install smoke (py3.13, from built wheel)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel (py3.13, isolated PEP 517)
        run: |
          pip install --upgrade pip build
          python -m build --wheel
      - name: Install built wheel into a clean venv and import it
        run: |
          python -m venv smoke-venv
          ./smoke-venv/bin/pip install --quiet dist/*.whl
          ./smoke-venv/bin/python -c "import SKSurrogate; assert SKSurrogate.__version__; print('OK', SKSurrogate.__version__)"
      # The base wheel must stay small: optional backends are extras, so none of
      # them may be pulled in by install_requires. If this step fails, something
      # reintroduced a heavy dependency into the core install.
      - name: Assert base install carries no optional backends
        run: |
          ./smoke-venv/bin/python - <<'PY'
          import importlib.util
          heavy = ["xgboost", "lightgbm", "rgf", "SALib", "eli5", "skrebate",
                   "imblearn", "category_encoders", "matplotlib", "dask",
                   "fastapi", "uvicorn"]
          present = [m for m in heavy if importlib.util.find_spec(m) is not None]
          assert not present, f"core install pulled optional backends: {present}"
          print("core install is lean")
          PY
      # A user who names an optional estimator must get an actionable message,
      # not a bare ModuleNotFoundError.
      - name: Assert missing-extra guidance
        run: |
          ./smoke-venv/bin/python - <<'PY'
          from SKSurrogate.deps import MissingOptionalDependency, require
          try:
              require("xgboost", purpose="the XGBoost estimator")
          except MissingOptionalDependency as exc:
              text = str(exc)
              assert 'sksurrogate[xgboost]' in text, text
              print(text.splitlines()[0])
          else:
              raise SystemExit("xgboost is installed in the core-only venv")
          PY

  # The library must be usable with only requirements-core.txt installed:
  # `import SKSurrogate` works, and naming an optional backend yields an
  # actionable message. Guards against a heavy dependency creeping back into
  # install_requires.
  core-only:
    name: "Core-only install (py3.12, no extras)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core requirements only
        run: |
          pip install --upgrade pip
          pip install -r requirements-core.txt pytest pygments
          pip install .
      - name: Optional backends must be absent
        run: |
          python - <<'PY'
          import importlib.util
          heavy = ["xgboost", "lightgbm", "rgf", "SALib", "eli5", "skrebate",
                   "imblearn", "category_encoders", "matplotlib", "dask",
                   "fastapi", "uvicorn"]
          present = [m for m in heavy if importlib.util.find_spec(m) is not None]
          assert not present, f"core install pulled optional backends: {present}"
          print("core install is lean")
          PY
      - name: Guidance + catalog annotation tests
        run: python -m pytest tests/test_optional_deps.py -q

  tests:
    name: "Tests + smoke (py3.12, current deps)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # mcp>=2.3 exercises the optional [mcp] extra's tools end-to-end
          # (tests/test_mcp_server.py); httpx is its transport dependency.
          pip install -r requirements.txt pytest pygments "httpx>=0.27" "mcp>=2.3"
          pip install .
      - name: Run test suite
        # `python -m pytest` (not bare `pytest`) so the repo root is on
        # sys.path and the `api.*` package is importable.
        run: python -m pytest tests/ -q
      - name: "Smoke: bounded AML end-to-end (airfoil subset)"
        timeout-minutes: 10
        run: python examples/smoke_aml.py

  bench-smoke:
    name: "Benchmark smoke (ionosphere)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest pygments
          pip install .[benchmark]
      - name: Run benchmark smoke subset (ionosphere, budget 8, 2 seeds)
        run: python -m benchmarks.run --smoke
      - name: Verify outputs exist
        run: |
          out=$(ls -d benchmarks/results/*/ | head -1)
          test -n "$out" || { echo "no results dir"; exit 1; }
          ls "$out" | grep -q 'results.jsonl' || { echo "missing results.jsonl"; exit 1; }
          echo "bench smoke outputs OK: $out"

  docker-smoke:
    name: "Docker production image smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --target prod -t sksurrogate:prod .
      - name: Start and probe
        run: |
          docker run -d --name sk -p 8013:8013 sksurrogate:prod
          for i in $(seq 1 30); do curl -fsS localhost:8013/api/health && break; sleep 2; done
          curl -fsS localhost:8013/api/health
          curl -fsS localhost:8013/ | grep -qi '<div id="root"'
