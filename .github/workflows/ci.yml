name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Notes on design (see Vikunja project "SKSurrogate", task A1):
# - The legacy .travis.yml never ran the test suite; it only installed
#   requirements and executed examples/example02.py. Both behaviours are
#   preserved, plus a real pytest run and packaging checks.
# - `build` covers the Python version matrix with an isolated PEP 517 build
#   (no dependencies installed), so it stays green even while individual
#   third-party wheels lag behind on newest interpreters.
# - `tests` runs on one modern interpreter with current unpinned
#   requirements (requirements.txt carries no pins; pinning/sklearn-matrix
#   is follow-up work). A3 fixes any deprecations this surfaces.

jobs:
  build:
    name: "Build sdist+wheel (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build backend
        run: pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-py${{ matrix.python-version }}
          path: dist/

  # Acceptance for task A2: `pip install sksurrogate` from the built
  # wheel must succeed on Python 3.13 with current dependencies, and the
  # package must import in a clean environment (i.e. install_requires is
  # complete). Runs after `build` so it installs what CI itself produced.
  install-smoke:
    name: "Install smoke (py3.13, from built wheel)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel (py3.13, isolated PEP 517)
        run: |
          pip install --upgrade pip build
          python -m build --wheel
      - name: Install built wheel into a clean venv and import it
        run: |
          python -m venv smoke-venv
          ./smoke-venv/bin/pip install --quiet dist/*.whl
          ./smoke-venv/bin/python -c "import SKSurrogate; assert SKSurrogate.__version__; print('OK', SKSurrogate.__version__)"
      - name: "Install smoke: MCP route snapshot ships inside the wheel"
        # ``api_request`` validates against sksurrogate_mcp/openapi_ops.json; a
        # wheel without it installs cleanly yet breaks the escape hatch, so the
        # data file is asserted explicitly (no httpx/mcp needed to read it).
        run: |
          ./smoke-venv/bin/python -c "
          import json
          from importlib.resources import files
          payload = json.loads((files('sksurrogate_mcp') / 'openapi_ops.json').read_text())
          assert payload['operation_count'] == len(payload['operations']), payload
          print('MCP snapshot OK:', payload['operation_count'], 'ops, core', payload['generated_from_version'])
          "
      # The base wheel must stay small: optional backends are extras, so none of
      # them may be pulled in by install_requires. If this step fails, something
      # reintroduced a heavy dependency into the core install.
      - name: Assert base install carries no optional backends
        run: |
          ./smoke-venv/bin/python - <<'PY'
          import importlib.util
          heavy = ["xgboost", "lightgbm", "rgf", "SALib", "eli5", "skrebate",
                   "imblearn", "category_encoders", "matplotlib", "dask",
                   "fastapi", "uvicorn"]
          present = [m for m in heavy if importlib.util.find_spec(m) is not None]
          assert not present, f"core install pulled optional backends: {present}"
          print("core install is lean")
          PY
      # A user who names an optional estimator must get an actionable message,
      # not a bare ModuleNotFoundError.
      - name: Assert missing-extra guidance
        run: |
          ./smoke-venv/bin/python - <<'PY'
          from SKSurrogate.deps import MissingOptionalDependency, require
          try:
              require("xgboost", purpose="the XGBoost estimator")
          except MissingOptionalDependency as exc:
              text = str(exc)
              assert 'sksurrogate[xgboost]' in text, text
              print(text.splitlines()[0])
          else:
              raise SystemExit("xgboost is installed in the core-only venv")
          PY

  # The library must be usable with only requirements-core.txt installed:
  # `import SKSurrogate` works, and naming an optional backend yields an
  # actionable message. Guards against a heavy dependency creeping back into
  # install_requires.
  core-only:
    name: "Core-only install (py3.12, no extras)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core requirements only
        run: |
          pip install --upgrade pip
          pip install -r requirements-core.txt pytest pygments
          pip install .
      - name: Optional backends must be absent
        run: |
          python - <<'PY'
          import importlib.util
          heavy = ["xgboost", "lightgbm", "rgf", "SALib", "eli5", "skrebate",
                   "imblearn", "category_encoders", "matplotlib", "dask",
                   "fastapi", "uvicorn"]
          present = [m for m in heavy if importlib.util.find_spec(m) is not None]
          assert not present, f"core install pulled optional backends: {present}"
          print("core install is lean")
          PY
      - name: Guidance + catalog annotation tests
        run: python -m pytest tests/test_optional_deps.py -q

  tests:
    name: "Tests + smoke (py3.12, current deps)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # mcp>=2.3 exercises the optional [mcp] extra's tools end-to-end
          # (tests/test_mcp_server.py); httpx is its transport dependency.
          # The <3 bound matches setup.py: the server imports the 2.x
          # mcp.server.mcpserver.MCPServer API.
          pip install -r requirements.txt "httpx>=0.27" "mcp>=2.3,<3"
          # The [test] extra is the single source of truth for what the suite
          # needs (pytest, pygments, hypothesis). Hand-listing it here is how
          # tests/test_search_invariants.py came to fail collection with
          # "No module named 'hypothesis'" while passing locally.
          pip install ".[test]"
      - name: "Drift guard: MCP OpenAPI snapshot vs live spec"
        # Fails when a control-plane route was added, renamed or removed without
        # regenerating sksurrogate_mcp/openapi_ops.json (see docs/mcp-server.rst).
        run: python scripts/generate_mcp_openapi_snapshot.py --check
      - name: Run test suite
        # `python -m pytest` (not bare `pytest`) so the repo root is on
        # sys.path and the `api.*` package is importable.
        env:
          # In CI the drift check must run, never skip (it skips only when the
          # API tree is unimportable, e.g. a wheel-only install).
          SKSURROGATE_MCP_REQUIRE_DRIFT_CHECK: "1"
        run: python -m pytest tests/ -q
      - name: "Smoke: bounded AML end-to-end (airfoil subset)"
        timeout-minutes: 10
        run: python examples/smoke_aml.py

  # The public API must keep behaving predictably across the scikit-learn
  # versions we claim to support. Two ends of the matrix are enough to catch a
  # contract drift: the oldest supported interpreter/estimator pair and the
  # current one. The pinning tests are the same file the shipped suite runs.
  sklearn-matrix:
    name: "sklearn matrix (py${{ matrix.python-version }}, sklearn ${{ matrix.sklearn }})"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            sklearn: "1.5.*"
          - python-version: "3.13"
            sklearn: "current"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-core.txt
          if [ "${{ matrix.sklearn }}" = "current" ]; then
            pip install ".[test]"
          else
            # scikit-learn 1.5 predates NumPy 2; pin both ends of that pair.
            pip install "numpy<2" "scikit-learn==${{ matrix.sklearn }}" ".[test]"
          fi
      - name: Contract tests
        run: python -m pytest tests/test_sklearn_compat.py tests/test_search_invariants.py -q

  # Property-based state-machine tests, bounded and derandomized so a CI run is
  # fast and reproducible. The contract they encode is docs/search-contract.rst.
  search-contract:
    name: "Search invariants (hypothesis)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-core.txt pytest pygments hypothesis
          pip install .
      - name: Run state-machine invariants and determinism
        run: python -m pytest tests/test_search_invariants.py tests/test_search_determinism.py -q

  # The core must stay usable without the platform; a cyclic import is how a
  # library silently becomes an application.
  layer-boundaries:
    name: "Layer boundaries (core never imports api/webui/mcp)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The check parses the source tree with `ast`; it needs pytest and nothing
      # else — deliberately, so it can never be satisfied by an installed wheel.
      - name: Install pytest
        run: |
          pip install --upgrade pip
          pip install pytest
      - name: Run import-direction lint
        run: python -m pytest tests/test_layer_boundaries.py -q

  bench-smoke:
    name: "Benchmark smoke (ionosphere)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest pygments
          pip install .[benchmark]
      - name: Run benchmark smoke subset (ionosphere, budget 8, 2 seeds)
        run: python -m benchmarks.run --smoke
      - name: Verify outputs exist
        run: |
          out=$(ls -d benchmarks/results/*/ | head -1)
          test -n "$out" || { echo "no results dir"; exit 1; }
          ls "$out" | grep -q 'results.jsonl' || { echo "missing results.jsonl"; exit 1; }
          echo "bench smoke outputs OK: $out"

  docker-smoke:
    name: "Docker production image smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --target prod -t sksurrogate:prod .
      - name: Start and probe
        run: |
          docker run -d --name sk -p 8013:8013 sksurrogate:prod
          for i in $(seq 1 30); do curl -fsS localhost:8013/api/health && break; sleep 2; done
          curl -fsS localhost:8013/api/health
          curl -fsS localhost:8013/ | grep -qi '<div id="root"'
