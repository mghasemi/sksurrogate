<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>404 — SKSurrogate</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://sksurrogate.com/">
<style>
:root{--ink:#0B0F14;--line:rgba(235,238,245,.13);--chalk:#E7ECF4;--dim:rgba(231,236,244,.62);--ember:#E07A3C}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--chalk);font-family:"Inter",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;width:1440px;margin:0 auto}
.mono{font-family:"Fira Mono","SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.wrap{text-align:center;padding:96px 0}
h1{font-weight:300;font-size:72px;letter-spacing:-.04em;margin:18px 0 14px}
p{color:var(--dim);font-size:15px;max-width:52ch;margin:0 auto;line-height:1.6}
a.btn{display:inline-block;margin-top:36px;background:var(--ember);color:#170B04;text-decoration:none;font-weight:600;font-size:15px;padding:14px 28px;border-radius:9px}
hr{border:0;border-top:1px solid var(--line);max-width:340px;margin:0 auto}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <hr>
  <div class="mono">404 · page not found</div>
  <h1>This surface has no signal.</h1>
  <p>The address you followed does not exist on sksurrogate.com. The documentation lives on Read the Docs; the code lives on GitHub.</p>
  <a class="btn" href="/">Back to sksurrogate</a>
</div>
</body>
</html>
