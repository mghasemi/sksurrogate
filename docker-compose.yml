# Development (hot reload):  docker compose --profile dev up --build
# Production (single port):  docker compose --profile prod up --build -d
services:
  sksurrogate-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
      args:
        EXTRAS: ${EXTRAS:-}
    container_name: sksurrogate-dev
    ports:
      - "5174:5173"   # Web UI (Vite dev server; proxies /api to the backend) — 5174 because host 5173 is used by a local Vite instance
      - "8013:8013"   # FastAPI backend, direct access
    volumes:
      - .:/app        # live source + var/ data; node_modules re-linked by entrypoint
    environment:
      SKSURROGATE_API_HOME: /app/var/sksurrogate-api

  sksurrogate:
    profiles: ["prod"]
    build:
      context: .
      target: prod
      args:
        EXTRAS: ${EXTRAS:-}
    container_name: sksurrogate
    restart: unless-stopped
    ports:
      - "${SKSURROGATE_PORT:-8013}:8013"   # UI and API on one port
    volumes:
      - sksurrogate-data:/data
    environment:
      SKSURROGATE_API_KEY: ${SKSURROGATE_API_KEY:-}
      SKSURROGATE_REQUIRE_AUTH: ${SKSURROGATE_REQUIRE_AUTH:-}
      SKSURROGATE_API_CORS_ORIGINS: ${SKSURROGATE_API_CORS_ORIGINS:-}

volumes:
  sksurrogate-data:
